<style>
/* --- src/styles/main.css --- */
:root {
  /* Colors */
  --bg-main: #0B0F19;
  --bg-card: rgba(15, 23, 42, 0.45);
  --bg-card-hover: rgba(15, 23, 42, 0.65);
  --bg-input: rgba(30, 41, 59, 0.5);
  --border-color: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.16);

  --color-primary: #6366F1;   /* Indigo */
  --color-secondary: #06B6D4; /* Cyan */
  --color-accent: #8B5CF6;    /* Violet */
  --color-success: #10B981;   /* Emerald */
  --color-error: #F43F5E;     /* Rose */
  --color-warning: #F59E0B;   /* Amber */

  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;

  --grad-primary: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  --grad-cyan: linear-gradient(135deg, var(--color-secondary), var(--color-primary));
  --grad-success: linear-gradient(135deg, #10B981, #059669);
  --grad-error: linear-gradient(135deg, #F43F5E, #E11D48);

  --font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* Scrollbar standard properties */
  scrollbar-color: var(--color-primary) var(--bg-main);
  scrollbar-width: thin;
  color-scheme: dark;
}

/* Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-main);
  color: var(--text-primary);
  font-family: var(--font-family);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 40%);
  background-attachment: fixed;
}

/* Custom Scrollbar fallback for older WebKit browsers */
@supports not (scrollbar-color: auto) {
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-main);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(99, 102, 241, 0.3);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(99, 102, 241, 0.6);
  }
}

/* Layout Grid */
.app-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 1.5rem;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 1.5rem;
  min-height: 100vh;
}

@media (max-width: 1024px) {
  .app-container {
    grid-template-columns: 1fr;
  }
}

/* Header & Sidebar */
header {
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 1.5rem;
}

.brand-title {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  background: linear-gradient(to right, #FFF, var(--text-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.brand-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Sidebar Wrapper */
.sidebar-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  position: sticky;
  top: 1.5rem;
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
  padding-right: 0.25rem;
}

/* Form Styles */
label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
}

input[type="text"],
input[type="number"],
select,
textarea {
  width: 100%;
  padding: 0.75rem 1rem;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 0.9rem;
  transition: var(--transition-fast);
  outline: none;
}

input[type="text"]:focus,
input[type="number"]:focus,
select:focus,
textarea:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
  background: rgba(30, 41, 59, 0.7);
}

/* Table Style */
.matrix-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.75rem;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border-color);
}

.matrix-table th {
  background: rgba(15, 23, 42, 0.6);
  padding: 0.75rem 1rem;
  text-align: left;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-color);
}

.matrix-table td {
  padding: 0.75rem 1rem;
  background: rgba(15, 23, 42, 0.3);
  border-bottom: 1px solid var(--border-color);
  font-size: 0.85rem;
}

.matrix-table tr:last-child td {
  border-bottom: none;
}

/* Markdown Container */
.markdown-body {
  font-size: 0.95rem;
  color: var(--text-primary);
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3 {
  margin-top: 1.5rem;
  margin-bottom: 0.75rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: #FFF;
}

.markdown-body h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
.markdown-body h2 { font-size: 1.3rem; }
.markdown-body h3 { font-size: 1.1rem; }

.markdown-body p {
  margin-bottom: 1rem;
  color: var(--text-secondary);
}

.markdown-body ul,
.markdown-body ol {
  margin-bottom: 1rem;
  padding-left: 1.5rem;
  color: var(--text-secondary);
}

.markdown-body li {
  margin-bottom: 0.25rem;
}

.markdown-body code {
  background: rgba(30, 41, 59, 0.8);
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
  font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 0.85rem;
  color: var(--color-secondary);
}

.markdown-body pre {
  background: #05070C !important;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1rem;
  overflow-x: auto;
  margin-bottom: 1rem;
}

.markdown-body pre code {
  background: transparent;
  padding: 0;
  color: var(--text-primary);
  font-size: 0.85rem;
}

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 1rem;
}

.markdown-body th,
.markdown-body td {
  border: 1px solid var(--border-color);
  padding: 0.5rem 0.75rem;
}

.markdown-body th {
  background: rgba(15, 23, 42, 0.6);
  color: var(--text-primary);
}

/* Animations */
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.15); }
  50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.35); }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-slide {
  animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* --- src/styles/glass.css --- */

/* Glassmorphism Panel */
.glass-panel {
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
}

.glass-panel:hover {
  border-color: var(--border-hover);
}

/* Specific glowing panels */
.glass-panel.glowing-primary {
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.1);
}

/* Glassmorphic buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.65rem 1.25rem;
  border-radius: 8px;
  font-family: var(--font-family);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: 1px solid rgba(255, 255, 255, 0.05);
  text-decoration: none;
  color: var(--text-primary);
  outline: none;
}

.btn-primary {
  background: var(--grad-primary);
  box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.3);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.5);
  filter: brightness(1.1);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(4px);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--border-hover);
}

.btn-danger {
  background: var(--grad-error);
  box-shadow: 0 4px 14px 0 rgba(244, 63, 94, 0.3);
}

.btn-danger:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px 0 rgba(244, 63, 94, 0.5);
  filter: brightness(1.1);
}

.btn-success {
  background: var(--grad-success);
  box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3);
}

.btn-success:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px 0 rgba(16, 185, 129, 0.5);
  filter: brightness(1.1);
}

.btn-sm {
  padding: 0.4rem 0.8rem;
  font-size: 0.75rem;
}

/* Step Flow nodes list */
.step-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 1rem;
}

.step-node {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.03);
  cursor: pointer;
  transition: all var(--transition-fast);
  user-select: none;
}

.step-node:hover {
  background: rgba(15, 23, 42, 0.5);
  border-color: rgba(255, 255, 255, 0.08);
  transform: translateX(2px);
}

.step-node.active {
  background: rgba(99, 102, 241, 0.12);
  border-color: rgba(99, 102, 241, 0.3);
  box-shadow: inset 0 0 12px rgba(99, 102, 241, 0.1);
}

.step-node.active .step-num {
  background: var(--grad-primary);
  color: #FFF;
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
}

.step-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.step-node.completed .step-num {
  background: rgba(16, 185, 129, 0.15);
  color: var(--color-success);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.step-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  flex-grow: 1;
}

.step-node.active .step-label {
  color: var(--text-primary);
}

.step-status-icon {
  font-size: 0.85rem;
  opacity: 0.5;
}

.step-node.completed .step-status-icon {
  color: var(--color-success);
  opacity: 1;
}

/* Timeline Widget (Sprint Tracker) */
.timeline-card {
  padding: 1.25rem;
}

.timeline-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
}

.timeline-title {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-secondary);
}

.timeline-percentage {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--color-secondary);
}

.progress-bar-container {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 1rem;
}

.progress-bar-fill {
  height: 100%;
  background: var(--grad-cyan);
  width: 0%;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.35rem;
}

.day-cell {
  aspect-ratio: 1;
  border-radius: 6px;
  background: rgba(15, 23, 42, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.03);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.day-cell:hover {
  background: rgba(15, 23, 42, 0.7);
  border-color: rgba(255, 255, 255, 0.1);
  transform: scale(1.05);
}

.day-cell.completed {
  background: rgba(16, 185, 129, 0.1);
  border-color: rgba(16, 185, 129, 0.3);
}

.day-num {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.day-cell.completed .day-num {
  color: var(--color-success);
}

.day-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 0.1rem;
}

/* Modals/Dialogs styling with light-dismiss */
dialog {
  margin: auto;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  background-color: #0E131F;
  color: var(--text-primary);
  max-width: 600px;
  width: calc(100% - 2rem);
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
  padding: 1.75rem;
  outline: none;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

dialog::backdrop {
  background-color: rgba(5, 7, 12, 0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.75rem;
}

.dialog-title {
  font-size: 1.15rem;
  font-weight: 700;
}

.dialog-close-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}

/* Steps Display Panel */
.panel-title-area {
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 1rem;
}

.panel-step-badge {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-secondary);
  margin-bottom: 0.25rem;
}

.panel-title {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

/* Details and helper text */
.step-description {
  color: var(--text-secondary);
  font-size: 0.95rem;
  margin-bottom: 1.5rem;
}

.step-meta {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* Copy card */
.copy-card {
  background: rgba(5, 7, 12, 0.4);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 1rem;
  margin-bottom: 1rem;
  position: relative;
}

.copy-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}

.copy-card-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--color-primary);
  text-transform: uppercase;
}

.copy-card-pre {
  background: #05070C;
  padding: 0.75rem;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.85rem;
  font-family: monospace;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 250px;
  border: 1px solid rgba(255, 255, 255, 0.03);
}

/* Forms layout inside panels */
.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

@media (min-width: 640px) {
  .form-grid-2 {
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }
}

/* Tab buttons for sub-actions */
.tab-row {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.5rem;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  padding: 0.4rem 0.8rem;
  font-family: var(--font-family);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: 6px;
  transition: all var(--transition-fast);
}

.tab-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.03);
}

.tab-btn.active {
  color: var(--color-primary);
  background: rgba(99, 102, 241, 0.08);
}

/* Suno Song Generator layout */
.song-lyrics-output {
  min-height: 200px;
  max-height: 400px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 0.85rem;
  white-space: pre-wrap;
  background: #05070C;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1rem;
}

/* Chat Simulator Sandbox */
.chat-sandbox {
  display: flex;
  flex-direction: column;
  height: 380px;
  background: #070B14;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  overflow: hidden;
}

.chat-messages {
  flex-grow: 1;
  padding: 1rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.chat-bubble {
  max-width: 80%;
  padding: 0.65rem 0.85rem;
  border-radius: 12px;
  font-size: 0.85rem;
  line-height: 1.4;
  word-wrap: break-word;
}

.chat-bubble.bot {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.02);
}

.chat-bubble.user {
  background: var(--grad-primary);
  color: #FFF;
  align-self: flex-end;
  border-bottom-right-radius: 2px;
  box-shadow: 0 4px 10px rgba(99, 102, 241, 0.15);
}

.chat-bubble.system {
  background: rgba(245, 158, 11, 0.1);
  color: var(--color-warning);
  align-self: center;
  font-size: 0.75rem;
  border: 1px solid rgba(245, 158, 11, 0.2);
}

.chat-input-area {
  display: flex;
  padding: 0.75rem;
  background: rgba(15, 23, 42, 0.6);
  border-top: 1px solid var(--border-color);
  gap: 0.5rem;
}

.chat-input-area input {
  flex-grow: 1;
}

/* Celebrations */
.success-gate-panel {
  text-align: center;
  padding: 2.5rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.trophy-glow {
  font-size: 3rem;
  filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5));
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

</style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Area -->
    <aside class="sidebar-panel">
      <!-- Brand Header -->
      <header>
        <div class="brand-title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          SOLO AGENCY 2.0
        </div>
        <div class="brand-subtitle">AI 智能体开发流程系统</div>
      </header>

      <!-- 14-Day Sprint Tracker -->
      <section class="glass-panel timeline-card glowing-primary" id="sprint-section">
        <div class="timeline-header">
          <span class="timeline-title">14天 MVP 冲刺排期</span>
          <span class="timeline-percentage" id="sprint-progress-percent">0%</span>

        <div class="progress-bar-container">

  const percentage = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

  const percentText = document.getElementById('sprint-progress-percent');
  if (fill) fill.style.width = `${percentage}%`;
  if (percentText) percentText.textContent = `${percentage}%`;

  // Update calendar cells appearance
  SPRINT_SCHEDULE.forEach(dayInfo => {
    const dayCell = document.querySelector(`.day-cell[data-day="${dayInfo.day}"]`);
    if (dayCell) {
      const allCompleted = dayInfo.tasks.every(t => state.checklist[t.id]);
      if (allCompleted) {
        dayCell.classList.add('completed');
      } else {
        dayCell.classList.remove('completed');
      }
    }
  });

  // Sync step indicators (if all tasks of a day associated with step are done, we can mark step as completed)
  // For simplicity, steps can be marked completed manually, or linked. Let's make it manual/semi-automatic.
  // Step 3 PRD is completed when name & breakout are filled.
  // Step 6 is active. Let's just update the list nodes dynamically.
  updateStepNodeClasses();
}

function updateStepNodeClasses() {
  const stepNodes = document.querySelectorAll('.step-node');
  stepNodes.forEach((node, idx) => {
    if (idx === state.stepIndex) {
      node.classList.add('active');
    } else {
      node.classList.remove('active');
    }

    // Custom check: is step completed?
    let isCompleted = false;
    if (idx === 0) isCompleted = !!state.prd.breakout;
    if (idx === 2) isCompleted = !!(state.prd.name && state.prd.functions.length > 0);
    if (idx === 5) isCompleted = state.checklist['d6-t1'] && state.checklist['d6-t2'];
    if (idx === 6) isCompleted = state.testCases.offline && state.testCases.storageFull && state.testCases.keyInvalid;
    if (idx === 7) isCompleted = !!state.lyrics.result;
    if (idx === 9) isCompleted = state.succeeded || !!state.retrospective;

    if (isCompleted) {
      node.classList.add('completed');
    } else {
      node.classList.remove('completed');
    }
  });
}

// DOM Rendering logic for active Step
function renderActiveStepPanel() {
  const currentStep = STEPS_DATA[state.stepIndex];
  
  // Update badge and title
  const badge = document.getElementById('step-badge-title');
  const title = document.getElementById('step-panel-title');
  const indicator = document.getElementById('step-navigation-indicator');
  
  if (badge) badge.textContent = currentStep.badge;
  if (title) title.textContent = currentStep.title;
  if (indicator) indicator.textContent = `步骤 ${state.stepIndex + 1}/11`;

  // Render Step Panels HTML
  const container = document.getElementById('step-body-container');
  if (!container) return;

  // Render content depending on stepIndex
  container.innerHTML = getStepPanelHTML(state.stepIndex);
  
  // Re-bind listeners for step-specific items
  bindStepPanelListeners(state.stepIndex);

  // Scroll main panel to top smoothly
  const mainPanel = document.getElementById('main-panel');
  if (mainPanel) {
    mainPanel.scrollTop = 0;
  }
}

// Binds panel event listeners after DOM loading
function bindStepPanelListeners(idx) {
  switch(idx) {
    case 0: { // Step 1
      const genBtn = document.getElementById('s1-generate-prompt-btn');
      const copyBtn = document.getElementById('s1-copy-btn');
      const promptCard = document.getElementById('s1-prompt-card');
      const promptText = document.getElementById('s1-prompt-text');
      const compInput = document.getElementById('s1-competitor');

      if (genBtn && promptCard && promptText) {
        genBtn.addEventListener('click', () => {
          const comp = compInput ? compInput.value : '目标产品';
          const prompt = `你是一位资深市场洞察专家。请对以下竞品/热门事件进行“第一性原理”拆解：
1. 它的最底层用户价值是什么？（去除社交、虚荣、管理焦虑，只看其实质帮助）
2. 现有方案在“数据隐私”、“操作链路”和“授权繁琐度”上有何痛点？
3. 如果做一个全本地化运行或极度轻量化的 MVP，我的核心破局点在哪里？（只保留那 20% 能产生 80% 价值的核心引擎，以及强行解耦的本地安全架构）

请拆解竞品：${comp}`;
          
          promptText.textContent = prompt;
          promptCard.style.display = 'block';
          
          // Pre-fill Step 3 breakout
          state.prd.breakout = `全本地安全自治，彻底解决传统云端对「${comp}」造成的隐私与多步授权痛点。`;
          saveState();
        });
      }

      if (copyBtn && promptText) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(promptText.textContent);
          copyBtn.textContent = '已复制！';
          setTimeout(() => copyBtn.textContent = '一键复制', 2000);
        });
      }
      break;
    }
    case 1: { // Step 2
      const checks = [
        document.getElementById('s2-check-1'),
        document.getElementById('s2-check-2'),
        document.getElementById('s2-check-3')
      ];

      checks.forEach((check, index) => {
        if (check) {
          // Load state
          const checkId = `s2-task-${index}`;
          check.checked = !!state.checklist[checkId];
          
          check.addEventListener('change', () => {
            state.checklist[checkId] = check.checked;
            saveState();
          });
        }
      });
      break;
    }
    case 2: { // Step 3
      const tabEdit = document.getElementById('tab-prd-edit');
      const tabPrev = document.getElementById('tab-prd-preview');
      const formContainer = document.getElementById('prd-form-container');
      const prevContainer = document.getElementById('prd-preview-container');

      if (tabEdit && tabPrev && formContainer && prevContainer) {
        tabEdit.addEventListener('click', () => {
          tabEdit.classList.add('active');
          tabPrev.classList.remove('active');
          formContainer.style.display = 'block';
          prevContainer.style.display = 'none';
        });

        tabPrev.addEventListener('click', () => {
          tabEdit.classList.remove('active');
          tabPrev.classList.add('active');
          formContainer.style.display = 'none';
          prevContainer.style.display = 'block';
          
          // Generate Markdown preview
          renderPrdMarkdown();
        });
      }

      // Input change binds
      const inputs = ['prd-name', 'prd-sovereignty', 'prd-breakout', 'prd-core-engine', 'prd-auth-gateway', 'prd-storage', 'prd-free-limit', 'prd-premium-benefit'];
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', () => {
            const key = id.replace('prd-', '').replace(/-([a-z])/g, (g) => g[1].toUpperCase());
            state.prd[key] = el.value;
            saveState();
          });
        }
      });

      // Render Functions table rows
      renderPrdFunctionsTable();

      const addBtn = document.getElementById('prd-add-func-btn');
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          state.prd.functions.push({ name: '新功能模块', io: '输入定义 -> 输出定义', priority: '中', mvp: true });
          saveState();
          renderPrdFunctionsTable();
        });
      }

      // MD copy and download
      const copyMd = document.getElementById('prd-copy-md-btn');
      if (copyMd) {
        copyMd.addEventListener('click', () => {
          const md = compilePrdMarkdownString();
          navigator.clipboard.writeText(md);
          copyMd.textContent = '已复制！';
          setTimeout(() => copyMd.textContent = '复制代码', 2000);
        });
      }

      const downloadMd = document.getElementById('prd-download-md-btn');
      if (downloadMd) {
        downloadMd.addEventListener('click', () => {
          const md = compilePrdMarkdownString();
          const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', `${state.prd.name || 'project'}_prd_2.0.md`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        });
      }
      break;
    }
    case 3: { // Step 4
      const copyBtn = document.getElementById('s4-copy-prompt-btn');
      const text = document.getElementById('s4-prompt-text');
      if (copyBtn && text) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(text.textContent);
          copyBtn.textContent = '已复制 UI 提示词！';
          setTimeout(() => copyBtn.textContent = '复制 UI 提示词', 2000);
        });
      }
      break;
    }
    case 5: { // Step 6
      const dropdown = document.getElementById('s6-active-module');
      const tabContainer = document.getElementById('s6-prompt-tabs');
      const roleTitle = document.getElementById('s6-role-title');
      const promptArea = document.getElementById('s6-prompt-area');
      const copyBtn = document.getElementById('s6-copy-prompt-btn');
      
      let activeRole = 'architect';

      function updateS6Prompt() {
        const activeModule = dropdown ? dropdown.value : '';
        let promptText = '';
        let titleText = '';

        if (activeRole === 'architect') {
          promptText = architectPrompt(state.prd);
          titleText = '智能架构师 (Architect) System Prompt';
        } else if (activeRole === 'developer') {
          promptText = developerPrompt(state.prd, activeModule);
          titleText = '智能开发员 (Developer) System Prompt';
        } else if (activeRole === 'reviewer') {
          promptText = reviewerPrompt(state.prd, activeModule);
          titleText = '智能审计员 (Reviewer) System Prompt';
        }

        if (promptArea) promptArea.textContent = promptText;
        if (roleTitle) roleTitle.textContent = titleText;
      }

      if (dropdown) {
        dropdown.addEventListener('change', updateS6Prompt);
      }

      if (tabContainer) {
        const tabs = tabContainer.querySelectorAll('.tab-btn');
        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            activeRole = tab.getAttribute('data-role');
            updateS6Prompt();
          });
        });
      }

      if (copyBtn && promptArea) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(promptArea.textContent);
          copyBtn.textContent = '已复制 Prompt！';
          setTimeout(() => copyBtn.textContent = '一键复制 Prompt', 2000);
        });
      }

      updateS6Prompt();
      break;
    }
    case 6: { // Step 7
      const testOffline = document.getElementById('s7-test-offline');
      const testStorage = document.getElementById('s7-test-storage');
      const testKey = document.getElementById('s7-test-key');

      const bindTest = (el, key) => {
        if (el) {
          el.addEventListener('change', () => {
            state.testCases[key] = el.checked;
            saveState();
          });
        }
      };

      bindTest(testOffline, 'offline');
      bindTest(testStorage, 'storageFull');
      bindTest(testKey, 'keyInvalid');
      break;
    }
    case 7: { // Step 8
      const tabMusic = document.getElementById('tab-s8-music');
      const tabPersona = document.getElementById('tab-s8-persona');
      const panelMusic = document.getElementById('s8-music-panel');
      const panelPersona = document.getElementById('s8-persona-panel');

      if (tabMusic && tabPersona && panelMusic && panelPersona) {
        tabMusic.addEventListener('click', () => {
          tabMusic.classList.add('active');
          tabPersona.classList.remove('active');
          panelMusic.style.display = 'block';
          panelPersona.style.display = 'none';
        });

        tabPersona.addEventListener('click', () => {
          tabMusic.classList.remove('active');
          tabPersona.classList.add('active');
          panelMusic.style.display = 'none';
          panelPersona.style.display = 'block';
          renderChatMessages();
        });
      }

      // Music Songwriter
      const keywordsInput = document.getElementById('s8-keywords');
      const genreSelect = document.getElementById('s8-genre');
      const genLyricsBtn = document.getElementById('s8-generate-lyrics-btn');
      const outputContainer = document.getElementById('s8-lyrics-output-container');
      const lyricsRendered = document.getElementById('s8-lyrics-rendered');
      const copyLyricsBtn = document.getElementById('s8-copy-lyrics-btn');

      if (keywordsInput) {
        keywordsInput.addEventListener('input', () => {
          state.lyrics.keywords = keywordsInput.value;
          saveState();
        });
      }
      if (genreSelect) {
        genreSelect.addEventListener('change', () => {
          state.lyrics.genre = genreSelect.value;
          saveState();
        });
      }

      // Load existing result
      if (state.lyrics.result && lyricsRendered && outputContainer) {
        lyricsRendered.textContent = state.lyrics.result;
        outputContainer.style.display = 'block';
      }

      if (genLyricsBtn) {
        genLyricsBtn.addEventListener('click', () => {
          const lyrics = getEdmSongLyrics(state.prd.name, state.lyrics.keywords, state.lyrics.genre);
          state.lyrics.result = lyrics;
          saveState();

          if (lyricsRendered && outputContainer) {
            lyricsRendered.textContent = lyrics;
            outputContainer.style.display = 'block';
            lyricsRendered.scrollTop = 0;
          }
        });
      }

      if (copyLyricsBtn && lyricsRendered) {
        copyLyricsBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(lyricsRendered.textContent);
          copyLyricsBtn.textContent = '已复制歌词！';
          setTimeout(() => copyLyricsBtn.textContent = '一键复制歌词', 2000);
        });
      }

      // Chat Simulator
      const chatInput = document.getElementById('s8-chat-input');
      const chatSendBtn = document.getElementById('s8-chat-send-btn');
      const personaSelect = document.getElementById('s8-persona-select');

      if (personaSelect) {
        personaSelect.addEventListener('change', () => {
          state.chatbot.persona = personaSelect.value;
          state.chatbot.messages = [
            { sender: 'bot', text: `你好！我是你的项目的数字人格分身，已加载 [${state.chatbot.persona}] 预设。在社交平台上，我会用这种调性与用户沟通，快来测试我吧！` }
          ];
          saveState();
          renderChatMessages();
        });
      }

      const sendMessage = () => {
        if (!chatInput) return;
        const text = chatInput.value.trim();
        if (!text) return;

        state.chatbot.messages.push({ sender: 'user', text });
        chatInput.value = '';
        renderChatMessages();

        // Simulate Persona response
        setTimeout(() => {
          const botReply = getPersonaResponse(state.chatbot.persona, text);
          state.chatbot.messages.push({ sender: 'bot', text: botReply });
          saveState();
          renderChatMessages();
        }, 800);
      };

      if (chatSendBtn) {
        chatSendBtn.addEventListener('click', sendMessage);
      }
      if (chatInput) {
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') sendMessage();
        });
      }
      break;
    }
    case 9: { // Step 10
      const btnFail = document.getElementById('s10-btn-fail');
      const btnSuccess = document.getElementById('s10-btn-success');
      const gatePanel = document.getElementById('s10-gate-panel');
      const successPanel = document.getElementById('s10-success-panel');
      const failurePanel = document.getElementById('s10-failure-panel');
      const reset1 = document.getElementById('s10-reset-decision-1');
      const reset2 = document.getElementById('s10-reset-decision-2');

      const showGate = () => {
        if (gatePanel) gatePanel.style.display = 'flex';
        if (successPanel) successPanel.style.display = 'none';
        if (failurePanel) failurePanel.style.display = 'none';
        state.succeeded = false;
        state.retrospective = '';
        saveState();
      };

      if (reset1) reset1.addEventListener('click', showGate);
      if (reset2) reset2.addEventListener('click', showGate);

      if (btnSuccess) {
        btnSuccess.addEventListener('click', () => {
          state.succeeded = true;
          saveState();
          if (gatePanel) gatePanel.style.display = 'none';
          if (successPanel) successPanel.style.display = 'block';
          
          // Trigger Confetti!
          if (confettiModule) {
            confettiModule({
              particleCount: 150,
              spread: 80,
              origin: { y: 0.6 }
            });
          }
        });
      }

      if (btnFail) {
        btnFail.addEventListener('click', () => {
          state.retrospective = '根据分析，本次失败核心原因是：[在此录入您的反思...]';
          saveState();
          if (gatePanel) gatePanel.style.display = 'none';
          if (failurePanel) failurePanel.style.display = 'block';
          
          // Fill tags
          renderPivotTags();
        });
      }

      // Retro input binding
      const retroInput = document.getElementById('s10-retro-input');
      if (retroInput) {
        retroInput.addEventListener('input', () => {
          state.retrospective = retroInput.value;
          saveState();
        });
      }

      // Handle Pivot Reset
      const pivotBtn = document.getElementById('s10-pivot-reset-btn');
      if (pivotBtn) {
        pivotBtn.addEventListener('click', () => {
          if (confirm('确认进行【底层回收，架构换壳】？这将清空当前的所有进度、歌词、聊天记录和上架文案，但会保留您的 PRD 2.0 系统架构层配置（业务逻辑层、授权管理层、数据持久层及核心模块表格）。')) {
            // Keep Core Architecture parameters
            const preservedPrd = {
              name: '', // Reset name
              breakout: '', // Reset breakout
              sovereignty: state.prd.sovereignty,
              coreEngine: state.prd.coreEngine,
              authGateway: state.prd.authGateway,
              storage: state.prd.storage,
              functions: [...state.prd.functions],
              freeLimit: state.prd.freeLimit,
              premiumBenefit: state.prd.premiumBenefit
            };

            state = {
              ...DEFAULT_STATE,
              prd: preservedPrd,
              failuresCount: state.failuresCount + 1,
              checklist: {} // Reset timeline
            };
            saveState();

            alert('解耦脱壳成功！底层逻辑库已回收，项目重置至 Step 1，快去寻找下一个破局点吧！');
            state.stepIndex = 0;
            saveState();
            renderActiveStepPanel();
            renderDaysGrid();
          }
        });
      }

      if (state.retrospective) {
        renderPivotTags();
      }

      break;
    }
    case 10: { // Step 11
      const copyBtn = document.getElementById('s11-copy-btn');
      const text = document.getElementById('s11-text-area');
      if (copyBtn && text) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(text.textContent);
          copyBtn.textContent = '已复制上架文案！';
          setTimeout(() => copyBtn.textContent = '复制合规声明', 2000);
        });
      }
      break;
    }
  }
}

// Compile PRD to markdown format
function compilePrdMarkdownString() {
  const name = state.prd.name || '未命名项目';
  const breakout = state.prd.breakout || '暂无说明';
  const sovereignty = state.prd.sovereignty || '未指定';
  const coreEngine = state.prd.coreEngine || '无';
  const authGateway = state.prd.authGateway || '无';
  const storage = state.prd.storage || '无';
  const freeLimit = state.prd.freeLimit || '无';
  const premiumBenefit = state.prd.premiumBenefit || '无';

  let md = `# 产品需求文档 (PRD) 2.0 - ${name}

## 1. 基础拓扑与差异化
- **项目名称**：${name}
- **核心破局点**：${breakout}
- **数据主权级别**：${sovereignty}

## 2. 系统架构与解耦规范
- **核心业务逻辑层 (Core Engine)**：
  \`\`\`text
  ${coreEngine}
  \`\`\`
- **API 与授权管理层 (Auth & API Gateway)**：
  \`\`\`text
  ${authGateway}
  \`\`\`
- **数据持久层 (Storage)**：
  \`\`\`text
  ${storage}
  \`\`\`

## 3. 核心功能矩阵 (严格限制 3 个以内)
| 模块名称 | 输入/输出定义 | 优先级 | MVP 是否包含 |
| :--- | :--- | :--- | :--- |
`;

  state.prd.functions.forEach(f => {
    md += `| ${f.name} | ${f.io} | ${f.priority} | ${f.mvp ? '是' : '否'} |\n`;
  });

  md += `
## 4. 变现点与冷启动宣发设计
- **免费限制**：${freeLimit}
- **增值权益**：${premiumBenefit}
`;
  return md;
}

// Render Markdown preview
function renderPrdMarkdown() {
  const renderContainer = document.getElementById('prd-markdown-render');
  if (!renderContainer) return;
  const md = compilePrdMarkdownString();
  if (markedModule && markedModule.parse) {
    renderContainer.innerHTML = markedModule.parse(md);

  const dialog = document.getElementById('day-detail-dialog');

  const desc = document.getElementById('dialog-day-desc');
  const checklistArea = document.getElementById('dialog-day-checklist-area');

  dayInfo.tasks.forEach(t => {
    const isChecked = !!state.checklist[t.id];
    
    const label = document.createElement('label');
    label.style.display = 'flex';
    label.style.alignItems = 'flex-start';
    label.style.gap = '0.5rem';
    label.style.cursor = 'pointer';
    label.style.fontWeight = 'normal';
    label.style.fontSize = '0.85rem';
    label.style.color = isChecked ? 'var(--text-secondary)' : 'var(--text-primary)';

    }

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = isChecked;
    check.style.marginTop = '0.2rem';
    
    check.addEventListener('change', () => {
      state.checklist[t.id] = check.checked;
      saveState();

  dialog.showModal();

// Dialog Light-dismiss Fallback (from modern-web-guidance)
function initDialogFallback() {
  const dialog = document.getElementById('day-detail-dialog');
  const closeBtn = document.getElementById('close-dialog-btn');

  if (closeBtn && dialog) {
    closeBtn.addEventListener('click', () => dialog.close());
  }

  if (dialog && !('closedBy' in HTMLDialogElement.prototype)) {
    dialog.addEventListener('click', (event) => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      const isDialogContent = (
        rect.top <= event.clientY &&
        event.clientY <= rect.top + rect.height &&
        rect.left <= event.clientX &&
        event.clientX <= rect.left + rect.width
      );
      if (isDialogContent) return;
      dialog.close();
    });
  }
}

// Local Sync functions
function initSyncManager() {
  const expBtn = document.getElementById('export-workspace-btn');
  const impBtn = document.getElementById('import-workspace-btn');
  const fileInput = document.getElementById('workspace-file-input');
  const resetBtn = document.getElementById('reset-workspace-btn');

  if (expBtn) {
    expBtn.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `solo_agency_project_${state.prd.name || 'unnamed'}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      document.body.removeChild(downloadAnchor);
    });
  }

  if (impBtn && fileInput) {
    impBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          state = { ...DEFAULT_STATE, ...imported };
          saveState();
          alert('项目配置备份恢复成功！');
          
          // Re-render everything
          renderStepsList();
          renderActiveStepPanel();
          renderDaysGrid();
          updateSprintProgress();
        } catch (err) {
          alert('解析备份 JSON 文件失败，请确保格式正确！');
        }
      };
      reader.readAsText(file);
    });
  }

  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      if (confirm('⚠️ 警告：确定清空全部项目进度与 PRD 表单数据吗？该操作不可逆，建议先备份项目！')) {
        localStorage.removeItem('solo_agency_state');
        loadState();
        alert('工作区数据已全部重置！');
        renderStepsList();
        renderActiveStepPanel();
        renderDaysGrid();
        updateSprintProgress();
      }
    });
  }
}

    }
  };

  if (prev) prev.addEventListener('click', () => shiftStep(-1));
  if (next) next.addEventListener('click', () => shiftStep(1));
  
  // Custom navigation
  document.body.addEventListener('click', (e) => {
    if (e.target && e.target.id === 's10-go-step11-btn') {
      state.stepIndex = 10; // Step 11 is index 10
      saveState();
      renderActiveStepPanel();
      renderStepsList();
    }
  });
}

// Main Bootloader
async function boot() {
  // 1. Load LocalStorage State
  loadState();

  // 2. Load External libraries via CDN async
  await loadLibraries();

  // 3. Render DOM structures
  renderStepsList();
  renderDaysGrid();
  renderActiveStepPanel();

  // 4. Bind Global controls
  initDialogFallback();
  initSyncManager();
  initNavigationControls();

  // 5. Update timeline progress
  updateSprintProgress();
}

// Execute boot when document is ready
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
