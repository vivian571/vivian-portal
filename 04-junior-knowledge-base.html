<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自家版初中知识库 · 知识点节点＋先修边＋错因回溯</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a24;
    --panel-2: #1e2230;
    --border: #2a3042;
    --text: #eef0f6;
    --muted: #949cb0;
    --math: #38bdf8;
    --eng: #f59e0b;
    --chn: #10b981;
    --hard: #f43f5e;
    --soft: #64748b;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .nav-tabs { display: flex; gap: 8px; }
  .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px; transition: .15s; }
  .tab-btn.active { background: var(--math); color: #081119; border-color: var(--math); }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-val { font-size: 26px; font-weight: 700; font-family: ui-monospace, monospace; }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .search-input { flex: 1; min-width: 220px; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 9px; font-size: 14px; outline: none; }
  .search-input:focus { border-color: var(--math); }
  .pill { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .pill.active { background: var(--text); color: var(--bg); font-weight: 600; border-color: var(--text); }

  .main-grid { display: grid; grid-template-columns: 1fr 440px; gap: 18px; align-items: start; }
  @media (max-width: 920px) { .main-grid { grid-template-columns: 1fr; } }

  .node-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; max-height: 680px; overflow-y: auto; padding-right: 4px; }
  .node-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: .15s; }
  .node-card:hover { border-color: var(--muted); transform: translateY(-1px); }
  .node-card.selected { border-color: var(--math); background: var(--panel-2); }
  .badge-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .subj-badge { padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
  .subj-数学 { background: rgba(56,189,248,.15); color: var(--math); }
  .subj-英语 { background: rgba(245,158,11,.15); color: var(--eng); }
  .subj-语文 { background: rgba(16,185,129,.15); color: var(--chn); }
  .status-tag { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
  .status-已入库 { color: var(--ok); font-weight: 600; }
  .status-待校准 { color: var(--eng); }
  .node-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .node-loc { font-size: 12px; color: var(--muted); }

  .detail-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; position: sticky; top: 16px; }
  .detail-id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--math); }
  .detail-title { font-size: 20px; font-weight: 700; margin: 4px 0 12px; }
  .field-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; margin-bottom: 10px; }
  .field-lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .chain-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .chain-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--border); padding: 8px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .chain-item:hover { border-color: var(--math); }
  .edge-hard { color: var(--hard); font-size: 12px; font-weight: 600; }
  .edge-soft { color: var(--soft); font-size: 12px; }

  /* Game View */
  .game-wrap { max-width: 760px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .level-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .lvl-pill { padding: 5px 10px; border-radius: 6px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
  .lvl-pill.current { border-color: var(--math); color: var(--math); font-weight: 700; }
  .lvl-pill.passed { background: rgba(34,197,94,.18); border-color: var(--ok); color: var(--ok); }
  .q-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 14px 0; }
  .q-text { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 9px; font-size: 15px; cursor: pointer; text-align: left; transition: .15s; }
  .opt-btn:hover { border-color: var(--math); }
  .opt-btn.correct { background: rgba(34,197,94,.2); border-color: var(--ok); color: var(--ok); }
  .opt-btn.wrong { background: rgba(244,63,94,.2); border-color: var(--hard); color: var(--hard); }
  .feedback-box { margin-top: 14px; padding: 12px 14px; border-radius: 9px; background: var(--bg); border-left: 3px solid var(--math); font-size: 13.5px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>自家版初中知识库 · Junior Knowledge Base</h1>
      <div class="sub">数学（青岛版）· 英语（外研版）· 语文（统编版）七年级上册 —— 知识点节点 ＋ 先修边 ＋ 错因回溯</div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabGraph">知识图谱与回溯查询</button>
      <button class="tab-btn" id="tabGame">回溯大冒险 · 有理数岛（闯关）</button>
    </div>
  </header>

  <div id="viewGraph">
    <div class="stats-row" id="statsRow"></div>
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索节点编号、名称、定义或真实错因（例如：数轴、绝对值、there be、修辞）..." />
      <button class="pill active" data-subj="ALL">全部科目</button>
      <button class="pill" data-subj="数学">数学（青岛版）</button>
      <button class="pill" data-subj="英语">英语（外研版）</button>
      <button class="pill" data-subj="语文">语文（统编版）</button>
      <button class="pill" data-status="已入库">★ 仅看已入库/待校准</button>
    </div>

    <div class="main-grid">
      <div class="node-list" id="nodeList"></div>
      <div class="detail-panel" id="detailPanel"></div>
    </div>
  </div>

  <div id="viewGame" style="display:none">
    <div class="game-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <h2 style="margin:0;font-size:20px" id="gameTitle"></h2>
          <div class="sub" id="gameChapter"></div>
        </div>
        <span style="font-size:12px;color:var(--math);background:rgba(56,189,248,.12);padding:5px 10px;border-radius:6px">答错自动触发先修节点回溯</span>
      </div>
      <div class="level-pills" id="levelPills"></div>
      <div class="q-box">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px" id="qMeta"></div>
        <div class="q-text" id="qText"></div>
        <div class="opt-grid" id="optGrid"></div>
        <div class="feedback-box" id="feedbackBox"></div>
      </div>
    </div>
  </div>
</div>

const nodeMap = Object.fromEntries(NODES.map(n => [n.id, n]));
let filterSubj = 'ALL';
let onlyCalibrated = false;
let selectedId = NODES.find(n => n.status === '已入库')?.id || NODES[0].id;

function renderStats() {
  const mathN = NODES.filter(n => n.subject === '数学').length;
  const engN = NODES.filter(n => n.subject === '英语').length;
  const chnN = NODES.filter(n => n.subject === '语文').length;
  const calN = NODES.filter(n => n.status !== '骨架').length;
  const hardE = EDGES.filter(e => e.strength === '硬').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-val">${NODES.length}</div><div class="stat-lbl">总知识点节点</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--math)">${mathN}</div><div class="stat-lbl">数学（青岛版七上）</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--eng)">${engN}</div><div class="stat-lbl">英语（外研版七上）</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--chn)">${chnN}</div><div class="stat-lbl">语文（统编版七上）</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--ok)">${calN}</div><div class="stat-lbl">已校准 / 含诊断内容</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--hard)">${EDGES.length} (${hardE}硬)</div><div class="stat-lbl">先修依赖边（硬依赖可回溯）</div></div>
  `;
}

function getPrereqs(id) {
  return EDGES.filter(e => e.to === id && nodeMap[e.from]).map(e => ({ node: nodeMap[e.from], edge: e }));
}

function getSuccessors(id) {
  return EDGES.filter(e => e.from === id && nodeMap[e.to]).map(e => ({ node: nodeMap[e.to], edge: e }));
}

function renderList() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = NODES.filter(n => {
    if (filterSubj !== 'ALL' && n.subject !== filterSubj) return false;
    if (onlyCalibrated && n.status === '骨架') return false;
    if (!q) return true;
    return [n.id, n.name, n.loc, n.definition, n.root_note, n.diagnostic].some(f => (f||'').toLowerCase().includes(q));
  });

  const listEl = document.getElementById('nodeList');
  listEl.innerHTML = filtered.map(n => `
    <div class="node-card ${n.id === selectedId ? 'selected' : ''}" data-id="${n.id}">
      <div class="badge-row">
        <span class="subj-badge subj-${n.subject}">${n.subject} · ${n.type}</span>
        <span class="status-tag status-${n.status}">${n.status}</span>
      </div>
      <div class="node-name">${n.name}</div>
      <div class="node-loc">${n.id} · ${n.loc}</div>
    </div>
  `).join('') || '<div style="color:var(--muted);padding:20px">没有匹配的节点</div>';

  listEl.querySelectorAll('.node-card').forEach(el => {
    el.addEventListener('click', () => {
      selectedId = el.dataset.id;
      renderList();
      renderDetail();
    });
  });
}

function renderDetail() {
  const n = nodeMap[selectedId];
  if (!n) return;
  const prereqs = getPrereqs(n.id);
  const succs = getSuccessors(n.id);

  document.getElementById('detailPanel').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="detail-id">${n.id} · ${n.loc}</span>
      <span class="subj-badge subj-${n.subject}">${n.subject} / ${n.status}</span>
    </div>
    <div class="detail-title">${n.name}</div>

    <div class="field-box">
      <div class="field-lbl">核心定义（Definition）</div>
      <div>${n.definition || '<span style="color:var(--muted)">（当前为目录骨架节点，待投喂真实课本/学案材料校准）</span>'}</div>
    </div>

    ${n.mastery ? `<div class="field-box"><div class="field-lbl">掌握标准（Mastery）</div><div>${n.mastery}</div></div>` : ''}
    ${n.diagnostic ? `<div class="field-box"><div class="field-lbl">诊断题（Diagnostic）</div><div>${n.diagnostic}</div></div>` : ''}
    ${n.root_note ? `<div class="field-box" style="border-color:rgba(244,63,94,.4)"><div class="field-lbl" style="color:var(--hard)">错因回溯提示（Root Note）</div><div>${n.root_note}</div></div>` : ''}

    <div style="margin-top:14px">
      <div class="field-lbl">⬅ 先修节点（如果本节点不会，点击回溯）：</div>
      <div class="chain-list">
        ${prereqs.length ? prereqs.map(p => `
          <div class="chain-item" data-jump="${p.node.id}">
            <span><b>${p.node.name}</b> <small style="color:var(--muted)">(${p.node.id})</small></span>
            <span class="${p.edge.strength === '硬' ? 'edge-hard' : 'edge-soft'}">${p.edge.strength}依赖 ${p.edge.note ? '· '+p.edge.note : ''}</span>
          </div>
        `).join('') : '<div style="font-size:12px;color:var(--muted)">无前置先修节点（起点）</div>'}
      </div>
    </div>

    <div style="margin-top:14px">
      <div class="field-lbl">➡ 后继节点（掌握本节点后解锁）：</div>
      <div class="chain-list">
        ${succs.length ? succs.map(s => `
          <div class="chain-item" data-jump="${s.node.id}">
            <span><b>${s.node.name}</b> <small style="color:var(--muted)">(${s.node.id})</small></span>
            <span class="${s.edge.strength === '硬' ? 'edge-hard' : 'edge-soft'}">${s.edge.strength}依赖</span>
          </div>
        `).join('') : '<div style="font-size:12px;color:var(--muted)">当前为链条末端节点</div>'}
      </div>
    </div>
  `;

  document.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', () => {
      selectedId = el.dataset.jump;
      renderList();
      renderDetail();
    });
  });
}

let curLvlIdx = 0;
const passedIds = new Set();

function renderGame() {
  document.getElementById('gameTitle').textContent = GAME.title;
  document.getElementById('gameChapter').textContent = GAME.chapter;
  const lvls = GAME.levels;
  const lvl = lvls[curLvlIdx];

  document.getElementById('levelPills').innerHTML = lvls.map((l, i) => `
    <button class="lvl-pill ${i === curLvlIdx ? 'current' : ''} ${passedIds.has(l.id) ? 'passed' : ''}" data-idx="${i}">
      ${i+1}. ${l.name}
    </button>
  `).join('');

  document.querySelectorAll('.lvl-pill').forEach(b => {
    b.addEventListener('click', () => { curLvlIdx = +b.dataset.idx; renderGame(); });
  });

  const item = lvl.items.main;
  const correctAns = item.options[0];
  const shuffled = [...item.options].sort(() => Math.random() - 0.5);

  document.getElementById('qMeta').textContent = `关卡 ${curLvlIdx + 1} / ${lvls.length} · 节点 ${lvl.id} (${lvl.loc})`;
  document.getElementById('qText').textContent = item.q;
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'none';

  const grid = document.getElementById('optGrid');
  grid.innerHTML = '';
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      if (opt === correctAns) {
        btn.classList.add('correct');
        passedIds.add(lvl.id);
        fb.style.display = 'block';
        fb.innerHTML = `<b style="color:var(--ok)">✓ 回答正确！</b> ${item.why} <div style="margin-top:8px"><button class="pill active" id="nextLvlBtn">下一关 →</button></div>`;
        const nb = document.getElementById('nextLvlBtn');
        if (nb) nb.onclick = () => { if (curLvlIdx < lvls.length - 1) curLvlIdx++; renderGame(); };
      } else {
        btn.classList.add('wrong');
        const preId = lvl.prereq && lvl.prereq[0];
        const preIdx = lvls.findIndex(x => x.id === preId);
        fb.style.display = 'block';
        fb.innerHTML = `<b style="color:var(--hard)">✗ 答错了！触发错因回溯：</b> ${item.why}
          ${lvl.root_note ? `<div style="margin-top:6px;color:var(--muted)"><b>常见错根：</b>${lvl.root_note}</div>` : ''}
          ${preIdx >= 0 ? `<div style="margin-top:8px"><button class="pill active" id="backLvlBtn">⬅ 回溯先修关卡：${lvls[preIdx].name}</button></div>` : ''}`;
        const bb = document.getElementById('backLvlBtn');
        if (bb) bb.onclick = () => { curLvlIdx = preIdx; renderGame(); };
      }
    });
    grid.appendChild(btn);
  });
}

document.querySelectorAll('[data-subj]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-subj]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterSubj = btn.dataset.subj;
    renderList();
  });
});

document.querySelector('[data-status]').addEventListener('click', (e) => {
  onlyCalibrated = !onlyCalibrated;
  e.target.classList.toggle('active', onlyCalibrated);
  renderList();
});

document.getElementById('searchInput').addEventListener('input', renderList);

document.getElementById('tabGraph').addEventListener('click', () => {
  document.getElementById('tabGraph').classList.add('active');
  document.getElementById('tabGame').classList.remove('active');
  document.getElementById('viewGraph').style.display = 'block';
  document.getElementById('viewGame').style.display = 'none';
});
document.getElementById('tabGame').addEventListener('click', () => {
  document.getElementById('tabGame').classList.add('active');
  document.getElementById('tabGraph').classList.remove('active');
  document.getElementById('viewGame').style.display = 'block';
  document.getElementById('viewGraph').style.display = 'none';
  renderGame();
});

renderStats();
renderList();
renderDetail();
</script>
</body>
</html>
