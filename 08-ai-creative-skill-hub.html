<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 创意工作台 · Vivian571 Skill Hub & Prompt Compiler</title>
<style>
  :root {
    --bg: #0c0d12;
    --panel: #141720;
    --panel-2: #1b1f2c;
    --border: #282e40;
    --text: #eef0f7;
    --muted: #8e96aa;
    --accent: #f97316;
    --accent-2: #38bdf8;
    --ok: #22c55e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1260px; margin: 0 auto; padding: 28px 20px 72px; }
  header {
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
    border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 22px;
  }
  .tag { font: 700 12px var(--mono); color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { margin: 4px 0 4px; font-size: 26px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 13.5px; }

  .skill-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .skill-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    cursor: pointer; transition: .15s;
  }
  .skill-card:hover { border-color: var(--muted); transform: translateY(-1px); }
  .skill-card.active { border-color: var(--accent); background: var(--panel-2); }
  .skill-repo { font: 600 12px var(--mono); color: var(--accent); margin-bottom: 4px; }
  .skill-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .skill-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }

  .workspace { display: grid; grid-template-columns: 420px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 920px) { .workspace { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .panel-title { font-size: 16px; font-weight: 700; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
  }
  .field textarea { min-height: 92px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    border: 0; border-radius: 9px; padding: 11px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #160a02; transition: .15s;
  }
  .btn:hover { opacity: 0.92; }
  .btn-ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-weight: 600; }

  .out-block {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    margin-bottom: 12px;
  }
  .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .out-title { font: 700 12.5px var(--mono); color: var(--accent-2); text-transform: uppercase; }
  .copy-mini { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .copy-mini:hover { color: var(--text); border-color: var(--accent-2); }
  pre.out-code {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font: 13px/1.65 var(--mono); color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="tag">TIER 4 · AI CREATIVE SKILL STUDIO</div>
      <h1>AI 创意工作台 · Skill 市场与可视化编译器</h1>
      <div class="sub">把 5 个高星开源 Skill 变成零门槛在线生产力工具：填一句话，直接生成可复制到 Suno / Midjourney / Gemini / Claude 的全套分步制作包。</div>
    </div>
  </header>

  <div class="skill-tabs" id="skillTabs"></div>

  <div class="workspace">
    <div class="panel" id="formPanel"></div>
    <div class="panel">
      <div class="panel-title">
        <span id="outHeaderTitle">编译结果（Production Package）</span>
        <button class="copy-mini" id="copyAllBtn">一键复制全部</button>
      </div>
      <div id="outputArea"></div>
    </div>
  </div>
</div>

      },

let curSkill = SKILLS[0];

function renderTabs() {
  document.getElementById('skillTabs').innerHTML = SKILLS.map(s => `
    <div class="skill-card ${s.id === curSkill.id ? 'active' : ''}" data-id="${s.id}">
      <div class="skill-repo">${s.repo}</div>
      <div class="skill-name">${s.name}</div>
      <div class="skill-desc">${s.desc}</div>
    </div>
  `).join('');

  document.querySelectorAll('.skill-card').forEach(el => {
    el.addEventListener('click', () => {
      curSkill = SKILLS.find(x => x.id === el.dataset.id);
      renderTabs();
      renderForm();
      runCompile();
    });
  });
}

function renderForm() {
  const fp = document.getElementById('formPanel');
  fp.innerHTML = `
    <div class="panel-title"><span>参数配置 · ${curSkill.name}</span></div>
    ${curSkill.fields.map(f => `
      <div class="field">
        <label>${f.label}</label>
        ${f.type === 'textarea'
          ? `<textarea id="f_${f.key}">${f.default}</textarea>`
          : f.type === 'select'
            ? `<select id="f_${f.key}">${f.options.map(o => `<option value="${o}" ${o===f.default?'selected':''}>${o}</option>`).join('')}</select>`
            : `<input type="text" id="f_${f.key}" value="${f.default}" />`
        }
      </div>
    `).join('')}
    <div class="btn-row">
      <button class="btn" id="compileBtn">⚡ 立即编译生成制作包</button>
    </div>
  `;
  document.getElementById('compileBtn').addEventListener('click', runCompile);
  fp.querySelectorAll('input, textarea, select').forEach(inp => {
    inp.addEventListener('input', runCompile);
  });
}

function getValues() {
  const vals = {};
  curSkill.fields.forEach(f => {
    const el = document.getElementById('f_' + f.key);
    vals[f.key] = el ? el.value : f.default;
  });
  return vals;
}

function runCompile() {
  const vals = getValues();
  const blocks = curSkill.compile(vals);
  const out = document.getElementById('outputArea');
  out.innerHTML = blocks.map((b, idx) => `
    <div class="out-block">
      <div class="out-head">
        <span class="out-title">${b.title}</span>
        <button class="copy-mini" data-idx="${idx}">复制本段</button>
      </div>
      <pre class="out-code" id="code_${idx}"></pre>
    </div>
  `).join('');

  blocks.forEach((b, idx) => {
    document.getElementById('code_' + idx).textContent = b.content;
  });

  out.querySelectorAll('.copy-mini').forEach(btn => {
    btn.addEventListener('click', () => {
      const txt = blocks[+btn.dataset.idx].content;
      navigator.clipboard.writeText(txt);
      btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = '复制本段', 1200);
    });
  });

  document.getElementById('copyAllBtn').onclick = () => {
    const allTxt = blocks.map(b => `=== ${b.title} ===
${b.content}`).join('

');
    navigator.clipboard.writeText(allTxt);
    const b = document.getElementById('copyAllBtn');
    b.textContent = '✓ 已复制全部';
    setTimeout(() => b.textContent = '一键复制全部', 1500);
  };
}

renderTabs();
renderForm();
runCompile();
</script>
</body>
</html>
